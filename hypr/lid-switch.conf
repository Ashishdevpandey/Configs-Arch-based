# hyprmode - Automatic lid switch detection
# Generated for laptop monitor: eDP-1

# When lid closes - check for external monitors and suspend if none
bindl = , switch:on:Lid Switch, exec, ~/.config/hypr/scripts/handle_lid.sh

# When lid opens - restore laptop display
bindl = , switch:off:Lid Switch, exec, omarchy-hyprland-monitor-internal on
